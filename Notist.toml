[package]
name = "icexiv-data"

[site]
title = "IceXIV Data"
content = "docs"
theme = "builtins.book"
directory_urls = true
copy_content_assets = false
exclude = ["**/AGENTS.md"]

[site.extensions.builtins.book]
select = true

[[extensions]]
kind = "replace"
imports = { typst = "docs/_components/typst/lib.notc" }
from = "notist.math"
to = "typst.math"
